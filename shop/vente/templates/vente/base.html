{%load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{%static 'base.css'%}">
    <link rel="shortcut icon" href="../assets/logo1.jpg" type="image/x-icon">
    <title>Base</title>
</head>
<body>
    <nav class="large-screen-nav">
        <div class="left-ls-nav">
            <img src="../assets/logo1.jpg" alt="">
            <div class="ls-nav-links-container">
                <a class="active" href="accueil.html">Accueil</a>
                <a href="boutique.html">Boutique</a>
                <a href="services.html">Services</a>
                <a href="apropos.html">A-Propos</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
        <div class="right-ls-nav">
            <form action="#" class="ls-nav-search-form">
                <img class="sr-icon-ls-nav" src="../assets/search.png" alt="">
                <input type="text" name="sr-input-ls-nav" id="sr-input-ls-nav" placeholder="Rechercher">
                <button class="sr-btn-ls-nav"><img src="../assets/search.png" alt=""></button>
            </form>
            <div class="ls-nav-panier-user">
                <a href="panier.html">
                    <span>5</span>
                    <img src="../assets/panier.png" alt="">
                </a>
                <a href="profil.html">
                    <div class="user-container"></div>
                </a>
            </div>
        </div>
    </nav>
    <nav class="mobile-screen-nav">
        <img id="open-mobile" class="hamburger-image" src="../assets/menu.png" alt="">
        <div class="ls-nav-panier-user">
            <a href="panier.html">
                <span>5</span>
                <img src="../assets/panier.png" alt="">
            </a>
            <a href="profil.html">
                <div class="user-container"></div>
            </a>
        </div>
    </nav>
    <div id="mobile-nav">
        <div class="mobile-header">
            <img class="logo-mobile" src="../assets/logo1.jpg" alt="">
            <img id="close-mobile" src="../assets/close.png" alt="">
        </div>
        <div class="mobile-nav-links-container">
            <a class="active" href="accueil.html">Accueil</a>
                <a href="boutique.html">Boutique</a>
                <a href="services.html">Services</a>
                <a href="apropos.html">A-Propos</a>
                <a href="contact.html">Contact</a>
        </div>
    </div>
    <form action="#" class="mobile-nav-search-form">
        <img class="sr-icon-mobile-nav" src="../assets/search.png" alt="">
        <input type="text" name="sr-input-ls-nav" id="sr-input-mobile-nav" placeholder="Rechercher">
        <button class="sr-btn-mobile-nav"><img src="../assets/search.png" alt=""></button>
    </form>
    <div class="contenu">
        {%block content %}{%endblock %}
    </div>
    <script src="{%static 'base.js'%}"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
