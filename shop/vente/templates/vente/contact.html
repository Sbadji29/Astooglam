{%load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{%static 'base.css'%}">
    <link rel="shortcut icon" href="{% static 'logo1.jpg'%}" type="image/x-icon">
    <title>Contact</title>
    <link rel="stylesheet" href="{%static 'contact.css'%}">
</head>
<body>
    <nav class="large-screen-nav">
        <div class="left-ls-nav">
            <a href="{% url '' %}"><img src="{% static 'logo1.jpg'%}" alt=""></a>
            <div class="ls-nav-links-container">
                <a href="{% url '' %}">Accueil</a>
                <a href="{% url 'boutique' %}">Boutique</a>
                <a href="{% url 'services' %}">Services</a>
                <a href="{% url 'apropos' %}">A-Propos</a>
                <a class="active" href="{% url 'contact' %}">Contact</a>
            </div>
        </div>
        <div class="right-ls-nav">
            <form action="#" class="ls-nav-search-form">
                <img class="sr-icon-ls-nav" src="{% static 'search.png'%}" alt="">
                <input type="text" name="sr-input-ls-nav" id="sr-input-ls-nav" placeholder="Rechercher">
                <button class="sr-btn-ls-nav"><img src="{% static 'search.png'%}" alt=""></button>
            </form>
            <div class="ls-nav-panier-user">
                <a href="{% url 'panier' %}">
                    <span>{{nombre}}</span>
                    <img src="{% static 'panier.png'%}" alt="">
                </a>
                <a href="{% url 'profil' %}">
                    <div class="user-container"></div>
                </a>
            </div>
        </div>
    </nav>
    <nav class="mobile-screen-nav">
        <img id="open-mobile" class="hamburger-image" src="{% static 'menu.png'%}" alt="">
        <div class="ls-nav-panier-user">
            <a href="{% url 'panier' %}">
                <span>{{nombre}}</span>
                <img src="{% static 'panier.png'%}" alt="">
            </a>
            <a href="{% url 'profil' %}">
                <div class="user-container"></div>
            </a>
        </div>
    </nav>
    <div id="mobile-nav">
        <div class="mobile-header">
            <img class="logo-mobile" src="{% static 'logo1.png'%}" alt="">
            <img id="close-mobile" src="{% static 'close.png'%}" alt="">
        </div>
        <div class="mobile-nav-links-container">
            <a href="{% url '' %}">Accueil</a>
            <a href="{% url 'boutique' %}">Boutique</a>
            <a href="{% url 'services' %}">Services</a>
            <a href="{% url 'apropos' %}">A-Propos</a>
            <a class="active" href="{% url 'contact' %}">Contact</a>
        </div>
    </div>
    <form action="#" class="mobile-nav-search-form">
        <img class="sr-icon-mobile-nav" src="{% static 'search.png'%}" alt="">
        <input type="text" name="sr-input-ls-nav" id="sr-input-mobile-nav" placeholder="Rechercher">
        <button class="sr-btn-mobile-nav"><img src="{% static 'search.png'%}" alt=""></button>
    </form>
    <div class="contenu">
        <div class="corps">
            <span>Envoyez-nous un mail</span>
            <form action="{% url 'contact' %}" method="POST">
                {% csrf_token %}
                <div class="formulaire">
                    <img class="icon" src="../assets/Mail outline.png" alt="">
                    <div class="donnee">
                        <input type="email" name="email" placeholder="Adresse Email" required>
                    </div>
                </div>
                <div class="donnee">
                    <textarea name="message" cols="30" rows="5" placeholder="Votre message" required></textarea>
                </div>
                <div class="bouton">
                    <button type="submit" class="btn">Envoyer</button>
                </div>
            </form>
        </div>
        {% if messages %}
        <div class="messages">
        {% for message in messages %}
            <p class="{{ message.tags }}">{{ message }}</p>
        {% endfor %}
        </div>
        {% endif %}        
        <span>Ou contactez-nous via </span>
        <div class="reseau">
            <div class="contact">
                <div class="RS"><a target="_blank" href="tel:+221777540222"><img src="{% static 'Phone.png'%}" alt=""></a></div>
                    <div class="RS"><a target="_blank" href="http://wa.me/221777540222"><img src="{% static 'WhatsApp.png'%}" alt=""></a></div>
                    <div class="RS"><a target="_blank" href="https://www.tiktok.com/@astooglam1?_t=ZM-8t69bsqL5M6&_r=1"><img src="{% static 'TikTok.png'%}" alt=""></a></div>
                    <div class="RS"><a target="_blank" href="https://www.instagram.com/astooglam?igsh=YWM0NzVwczVsY3Ey&utm_source=qr"><img src="{% static 'Instagram.png'%}" alt=""></a></div>
                    <div class="RS"><a target="_blank" href="https://snapchat.com/t/a0JSc7vo"><img src="{% static 'Snapchat.png'%}" alt=""></a></div>
            </div>
        </div>
    </div>
    <script src="{%static 'base.js'%}"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
